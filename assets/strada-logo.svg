<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 84" role="img" aria-label="StradaXR">
  <!--
    PLACEHOLDER MARK, redrawn from the supplied logo image rather than copied
    from a source file. It is geometrically close, not the official asset.
    To use the real one: drop the official SVG or PNG in this folder as
    strada-logo.svg (or .png and change the <img src> in index.html) — nothing
    else references the artwork, so swapping the file is the whole change.
  -->
  <g fill="currentColor">
    <!-- angular S: three offset parallelogram strokes -->
    <path d="M60.5 6 L86 6 L61 33 L35.5 33 Z"/>
    <path d="M52 39.5 L77.5 39.5 L52.5 66.5 L27 66.5 Z"/>
    <path d="M30 6 L45 6 L20 33 L5 33 Z" opacity=".92"/>
    <path d="M82 39.5 L97 39.5 L72 66.5 L57 66.5 Z" opacity=".92"/>
  </g>
  <g fill="currentColor" font-family="'Big Shoulders Display','Arial Narrow',sans-serif"
     font-weight="700" letter-spacing="7">
    <text x="118" y="56" font-size="42">STRADA</text>
    <text x="292" y="38" font-size="19" letter-spacing="1">XR</text>
  </g>
</svg>
